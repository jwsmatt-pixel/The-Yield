<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Group Cost Normaliser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* ground + ink */
  --color-bg:#f5ead8;          /* warm cream page */
  --color-surface:#ebddc5;      /* sand panels, inputs, cards */
  --color-text:#201e1d;
  --color-divider:color-mix(in srgb,#201e1d 16%,transparent);

  /* accents: terracotta (primary), sage (second voice) */
  --color-accent:#c67139;
  --color-accent-2:#7a8a5e;

  --color-neutral-100:#f9f4ed; --color-neutral-200:#eee7db; --color-neutral-300:#dcd3c4;
  --color-neutral-400:#c0b6a5; --color-neutral-500:#a19786; --color-neutral-600:#82796a;
  --color-neutral-700:#645c50; --color-neutral-800:#474238; --color-neutral-900:#2e2b25;

  --color-accent-100:#fff2eb; --color-accent-200:#ffe1d0; --color-accent-300:#ffc6a5;
  --color-accent-400:#f6a06b; --color-accent-500:#d67f48; --color-accent-600:#b2622d;
  --color-accent-700:#8c491a; --color-accent-800:#643312; --color-accent-900:#402310;

  --color-accent-2-100:#f0fae1; --color-accent-2-200:#e1eecc; --color-accent-2-300:#ccdbb2;
  --color-accent-2-400:#aebf92; --color-accent-2-500:#8fa073; --color-accent-2-600:#728157;
  --color-accent-2-700:#56633f; --color-accent-2-800:#3d472b; --color-accent-2-900:#272e1b;

  --font-heading:"Source Serif 4",Georgia,serif;
  --font-heading-weight:600;
  --font-body:"Figtree",system-ui,sans-serif;

  --space-1:4.4px; --space-2:8.8px; --space-3:13.2px;
  --space-4:17.6px; --space-6:26.4px; --space-8:35.2px;

  --radius-sm:8px; --radius-md:16px; --radius-lg:28px;

  --shadow-sm:0 1px 2px color-mix(in srgb,#2e2b25 14%,transparent);
  --shadow-md:0 3px 10px color-mix(in srgb,#2e2b25 16%,transparent);
  --shadow-lg:0 12px 32px color-mix(in srgb,#2e2b25 22%,transparent);

  /* legacy variable names — kept so any string not covered by the recipe swaps below still resolves sensibly */
  --ink:var(--color-text);
  --ink-soft:color-mix(in srgb, var(--color-text) 65%, transparent);
  --paper:var(--color-bg);
  --panel:var(--color-surface);
  --line:var(--color-neutral-300);
  --line-soft:var(--color-divider);
  --save:var(--color-accent-2-800);
  --save-bg:var(--color-accent-2-200);
  --review:var(--color-accent-700);
  --review-bg:var(--color-accent-200);
  --danger:var(--color-accent-700);
  --danger-bg:var(--color-accent-200);
  --current:var(--color-neutral-700);
  --current-bg:var(--color-neutral-200);
  --radius:var(--radius-lg);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--color-bg);
  color:var(--color-text);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric: tabular-nums;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;font-size:14px;}
a{color:inherit;}
:focus-visible{outline:2px solid var(--color-accent); outline-offset:2px;}
::selection{background:color-mix(in srgb, var(--color-accent) 30%, transparent);}

/* ---- Shell ---- */
#app{display:flex; min-height:100vh; padding:var(--space-4); gap:var(--space-4); background:var(--color-bg);}
.rail{
  width:248px; flex:none; background:var(--color-surface); color:var(--color-text);
  border-radius:var(--radius-lg); display:flex; flex-direction:column; padding:0;
}
.rail-brand{padding:var(--space-4); border:0; margin-bottom:0;}
.rail-brand .mark{display:none;}
.rail-brand .name{font-family:var(--font-heading); font-weight:600; font-size:24px; line-height:1.05;}
.rail-brand .sub{font-size:12px; opacity:.7; margin-top:4px; letter-spacing:0; text-transform:none;}
.rail-nav{display:flex; flex-direction:column; padding:0 var(--space-3); gap:6px;}
.rail-btn{
  text-align:left; background:transparent; border:none; color:inherit;
  padding:12px 18px; border-radius:999px; font-size:15px; font-weight:600;
  display:flex; align-items:center; justify-content:space-between;
}
.rail-btn:hover{background:color-mix(in srgb, var(--color-text) 7%, transparent); color:inherit;}
.rail-btn.active{background:var(--color-accent); color:var(--color-bg);}
.rail-btn .count{
  font-size:12px; background:var(--color-accent-2-200); color:var(--color-accent-2-800);
  padding:2px 10px; border-radius:999px;
}
.rail-btn.active .count{background:var(--color-bg); color:var(--color-accent-800);}
.rail-foot{margin-top:auto; padding:var(--space-4); border:0;}
.rail-foot button{
  width:100%; background:transparent; border:1px solid var(--color-divider); color:inherit;
  padding:8px 14px; border-radius:999px; font-size:12.5px; margin-top:8px; text-align:center;
}
.rail-foot button:hover{border-color:var(--color-accent); color:var(--color-accent-700);}
.rail-foot button.danger:hover{border-color:var(--color-accent-700); color:var(--color-accent-700);}

.main{flex:1; min-width:0; padding:var(--space-2) 0;}
.topline{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:var(--space-6); flex-wrap:wrap; gap:6px;}
.topline h1{font-family:var(--font-heading); font-weight:600; font-size:40px; margin:0; line-height:1.05; letter-spacing:0;}
.topline .meta{font-size:13px; color:var(--color-text); opacity:.65; max-width:420px; text-wrap:pretty;}

/* ---- Summary strip ---- */
.summary-strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:var(--space-3); margin-bottom:var(--space-6);}
.summary-card{
  background:var(--color-surface); border:0; border-radius:var(--radius-lg);
  padding:var(--space-4); min-width:0;
}
.summary-card .v{font-family:var(--font-heading); font-weight:600; font-size:34px; line-height:1; font-variant-numeric:tabular-nums;}
.summary-card .l{font-size:12.5px; opacity:.8; margin-top:10px;}
.summary-card.opportunity{background:var(--color-accent-2-700); color:var(--color-bg);}
.summary-card.opportunity .v{color:inherit;}
.summary-card.opportunity.indicative{background:var(--color-accent); color:var(--color-bg);}
.summary-card.opportunity.indicative .v{color:inherit;}
.summary-card.review{background:var(--color-accent-100); color:var(--color-accent-800);}
.summary-card.review .v{color:inherit;}

/* ---- Panels / tables ---- */
.panel{background:var(--color-surface); border:0; border-radius:var(--radius-lg); margin-bottom:var(--space-4); overflow:hidden;}
.panel-head{padding:var(--space-4); border-bottom:1px solid var(--color-divider); display:flex; align-items:center; justify-content:space-between;}
.panel-head h2{font-family:var(--font-heading); font-weight:600; font-size:24px; margin:0; line-height:1.15;}
.panel-head .hint{font-size:12px; opacity:.7;}
table{width:100%; border-collapse:collapse;}
th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.08em; opacity:.6;
  font-weight:600; padding:var(--space-2) 10px; border-bottom:1px solid var(--color-divider); background:transparent;
}
td{padding:13px 10px; border-bottom:1px solid var(--color-divider); font-size:13.5px; vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.best-row{background:var(--color-accent-2-100);}
.num-cell{font-variant-numeric:tabular-nums;}
.right{text-align:right;}

.group-input{
  width:140px; padding:8px 14px; border:1px solid var(--color-divider); border-radius:999px;
  background:var(--color-surface); font-size:13.5px; min-height:36px;
}
.group-input:focus{outline:none; border-color:var(--color-accent);}

/* annual saving hero */
.annual-hero{border-radius:var(--radius-lg); padding:var(--space-6); margin-bottom:var(--space-4);}
.annual-hero.empty{background:var(--color-surface); border:0;}
.hero-prompt{font-size:14px; opacity:.75;}
.hero-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.hero-group-name{font-size:14px; font-weight:600;}
.hero-num{font-family:var(--font-heading); font-weight:600; font-size:60px; line-height:1.02; font-variant-numeric:tabular-nums;}
.hero-per{font-size:24px; font-weight:600;}
.hero-monthly{font-size:14px; opacity:.85; margin-top:4px; font-variant-numeric:tabular-nums;}
.hero-provenance{font-size:12px; opacity:.7; margin-top:8px;}
.hero-reason{font-size:13.5px; opacity:.85; margin-top:16px; padding-top:16px; border-top:1px solid color-mix(in srgb, currentColor 18%, transparent); max-width:660px;}

/* pack chip */
.pack-chip{
  display:inline-flex; align-items:center; gap:7px; background:var(--color-bg); border:1px solid var(--color-neutral-300);
  border-radius:999px; padding:5px 12px; font-size:12.5px; font-variant-numeric:tabular-nums; cursor:pointer;
}
.pack-chip:hover{border-color:var(--color-accent); background:var(--color-accent-100);}
.pack-chip .dot{width:8px; height:8px; border-radius:999px; flex:none;}
.dot.verified{background:var(--color-accent-2);}
.dot.predicted{background:var(--color-neutral-400);}
.dot.review{background:var(--color-accent);}

.badge{display:inline-block; font-size:11.5px; font-weight:600; padding:4px 12px; border-radius:999px; letter-spacing:0;}
.badge.verified{background:var(--color-accent-2-200); color:var(--color-accent-2-800);}
.badge.predicted{background:var(--color-neutral-200); color:var(--color-neutral-800);}
.badge.review{background:var(--color-accent-200); color:var(--color-accent-800);}
.badge.missing{background:var(--color-accent-200); color:var(--color-accent-800);}

.pill-btn{
  background:transparent; border:1px solid var(--color-divider); border-radius:999px; padding:8px 16px;
  font-family:var(--font-heading); font-weight:600; font-size:14px; color:var(--color-text);
}
.pill-btn:hover{background:color-mix(in srgb, var(--color-text) 7%, transparent);}
.pill-btn.primary{background:var(--color-accent); color:var(--color-bg); border-color:var(--color-accent);}
.pill-btn.primary:hover{background:var(--color-accent-600); opacity:1;}
.pill-btn.save{background:var(--color-accent-2-700); color:var(--color-bg); border-color:var(--color-accent-2-700);}
.pill-btn.save:hover{background:var(--color-accent-2-800); opacity:1;}
.pill-btn.ghost{border:none; background:none; color:var(--color-accent-700);}
.pill-btn.ghost:hover{background:color-mix(in srgb, var(--color-accent) 10%, transparent); color:var(--color-accent-700);}
.pill-btn:disabled{opacity:.45; cursor:not-allowed;}
.pill-btn + .pill-btn{margin-left:6px;}

.empty{padding:var(--space-8) var(--space-4); text-align:left; opacity:.75; font-size:13.5px;}
.empty .pill-btn{margin-top:12px;}

/* group grid on Compare landing */
.group-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:var(--space-3);}
.group-card{
  background:var(--color-surface); border:1px solid var(--color-neutral-200); border-radius:var(--radius-lg);
  padding:var(--space-4); text-align:left; box-shadow:var(--shadow-sm);
}
.group-card:hover{border-color:var(--color-accent-300); box-shadow:var(--shadow-md);}
.group-card .gname{font-family:var(--font-heading); font-weight:600; font-size:22px; line-height:1.15; margin-bottom:8px;}
.group-card .grow{display:flex; justify-content:space-between; font-size:12.5px; opacity:.75; margin-top:3px;}
.group-card .gbest{display:inline-block; font-weight:700; font-size:13px; margin-top:10px; padding:5px 12px; border-radius:999px; background:var(--color-accent-2-200); color:var(--color-accent-2-800);}
.group-card .gwarn{font-size:12px; color:var(--color-accent-700); margin-top:8px;}

.diff-note{font-size:11.5px; opacity:.7; margin-top:2px;}
.diff-note.pos{color:var(--color-accent-2-800); opacity:1;}

/* modal */
.overlay{position:fixed; inset:0; background:color-mix(in srgb, var(--color-neutral-900) 45%, transparent); display:flex; align-items:flex-start; justify-content:center; padding:48px 16px; z-index:50; overflow:auto;}
.modal{background:var(--color-bg); border-radius:var(--radius-lg); width:min(580px,100%); max-width:100%; border:0; box-shadow:var(--shadow-lg);}
.modal-head{padding:var(--space-6) var(--space-6) 0; border:0;}
.modal-head .kicker{font-size:12.5px; font-weight:600; color:var(--color-accent-700); margin-bottom:4px; text-transform:none; letter-spacing:0;}
.modal-head h3{margin:0; font-family:var(--font-heading); font-weight:600; font-size:28px; line-height:1.15;}
.modal-head .sku{font-size:12.5px; opacity:.7; margin-top:6px; font-variant-numeric:tabular-nums;}
.modal-body{padding:var(--space-4) var(--space-6) var(--space-6);}
.field-row{display:flex; gap:10px; margin-bottom:12px;}
.field{flex:1;}
.field label{display:block; font-size:12px; opacity:.7; margin-bottom:5px; text-transform:none; letter-spacing:0;}
.field input, .field select{width:100%; padding:8px 14px; border:1px solid var(--color-divider); border-radius:999px; background:var(--color-surface); min-height:36px;}
.field input:focus, .field select:focus{outline:none; border-color:var(--color-accent);}
.ladder{
  display:flex; align-items:center; gap:6px; font-size:12.5px;
  background:var(--color-accent-2-100); border-radius:999px; padding:var(--space-3) var(--space-4);
  margin:2px 0 16px 0; flex-wrap:wrap;
}
.ladder b{color:inherit;}
.derived{background:var(--color-surface); border:0; border-radius:var(--radius-lg); padding:var(--space-4); margin-top:4px;}
.derived .row{display:flex; justify-content:space-between; font-size:13.5px; padding:4px 0;}
.derived .row.total .v{font-weight:600; font-size:16px;}
.derived .row.cost .v{font-family:var(--font-heading); font-weight:600; font-size:28px; color:inherit;}
.derived .warn{color:var(--color-accent-700); font-size:12.5px; margin-top:6px;}
.modal-foot{padding:0 var(--space-6) var(--space-6); border:0; display:flex; justify-content:flex-end; gap:8px;}
.src-note{font-size:13px; margin:0 0 14px 0; padding:12px 16px; background:var(--color-surface); border-radius:var(--radius-lg);}

/* import */
.dropzone{
  border:2px dashed var(--color-accent-300); border-radius:var(--radius-lg); padding:var(--space-8); text-align:left; opacity:.9;
  background:var(--color-surface);
}
.dropzone input{display:none;}
.map-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:var(--space-4);}
.map-row label{font-size:12.5px; opacity:.75; display:block; margin-bottom:5px;}
.map-row select{width:100%; padding:8px 14px; border:1px solid var(--color-divider); border-radius:999px; background:var(--color-bg);}
.req{color:var(--color-accent-700); font-size:11.5px; font-weight:600; margin-left:3px;}

.filters{display:flex; gap:8px; padding:var(--space-4); border-bottom:1px solid var(--color-divider); flex-wrap:wrap;}
.filters input, .filters select{padding:8px 14px; border:1px solid var(--color-divider); border-radius:999px; font-size:13px; background:var(--color-bg);}
.filters input{width:200px;}

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--color-neutral-900); color:var(--color-bg);
  padding:12px 22px; border-radius:999px; font-size:13px; z-index:80; box-shadow:var(--shadow-md);
}
.small-btn-inline{font-size:11px; color:var(--color-accent-700); background:none; border:none; text-decoration:underline; padding:0;}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ============================================================
// GROUP COST NORMALISER — v0.1
// Layers, kept deliberately separate per the architecture in the spec:
//   Import -> Prediction -> Truth/Override -> Conversion -> Cost
//   -> Comparison -> Opportunity -> Presentation
// ============================================================

/* ---------------- CONVERSION + COST ENGINE (deterministic, pure) ---------------- */

const UNIT_DIMENSION = {
  MG:"mass", G:"mass", KG:"mass",
  ML:"volume", L:"volume",
  EA:"count", EACH:"count", UNIT:"count", UNITS:"count", PCS:"count", PIECE:"count", PIECES:"count",
};
const CANONICAL_UNIT = { mass:"kg", volume:"L", count:"each" };
const TO_CANONICAL = {
  MG:v=>v/1_000_000, G:v=>v/1000, KG:v=>v,
  ML:v=>v/1000, L:v=>v,
  EA:v=>v, EACH:v=>v, UNIT:v=>v, UNITS:v=>v, PCS:v=>v, PIECE:v=>v, PIECES:v=>v,
};
function normaliseUnitToken(tok){
  if(!tok) return null;
  let t = tok.trim().toUpperCase();
  if(["LTR","LT","LITRE","LITER","LITERS","LITRES"].includes(t)) t="L";
  if(["GRAM","GRAMS","GM","GMS"].includes(t)) t="G";
  if(["KGS","KILO","KILOS","KILOGRAM","KILOGRAMS"].includes(t)) t="KG";
  if(["MGS","MILLIGRAM","MILLIGRAMS"].includes(t)) t="MG";
  if(["MLS","MILLILITRE","MILLILITRES","MILLILITER","MILLILITERS"].includes(t)) t="ML";
  return UNIT_DIMENSION[t] ? t : null;
}
function makePack({outers,inners,unitsPerInner,qtyPerUnit,unit}){
  return {outers:outers??null, inners:inners??null, unitsPerInner:unitsPerInner??null, qtyPerUnit:qtyPerUnit??null, unit:unit??null};
}
// Container/case words describe HOW something is packed, not WHAT canonical
// quantity it is (Bucket, Tin, Btle, Drum, Wedge, Crate, Pouch...). Rather than
// maintain an exhaustive word list, trust a parenthetical detail's CONTENT —
// "Bucket (10kg)" -> read "10kg" — but only when no OTHER digit sits outside
// the parens, so an outer multiplier like "3 x (5kg)" is never silently dropped.
function searchQuantity(t){
  const NUM = "\\d+(?:\\.\\d+)?", UW = "[A-Z]+";
  const candidates = [
    {re:new RegExp(`(${NUM})\\s*X\\s*(${NUM})\\s*X\\s*(${NUM})\\s*(${UW})`), levels:3},
    {re:new RegExp(`(${NUM})\\s*X\\s*(${NUM})\\s*(${UW})`), levels:2},
    {re:new RegExp(`(${NUM})\\s*(${UW})`), levels:1},
  ];
  for(const {re,levels} of candidates){
    const m = t.match(re);
    if(!m) continue;
    let unit, pack;
    if(levels===3){ unit=normaliseUnitToken(m[4]); if(!unit) continue; pack=makePack({outers:1,inners:+m[1],unitsPerInner:+m[2],qtyPerUnit:+m[3],unit}); }
    else if(levels===2){ unit=normaliseUnitToken(m[3]); if(!unit) continue; pack=makePack({outers:1,inners:+m[1],unitsPerInner:1,qtyPerUnit:+m[2],unit}); }
    else { unit=normaliseUnitToken(m[2]); if(!unit) continue; pack=makePack({outers:1,inners:1,unitsPerInner:1,qtyPerUnit:+m[1],unit}); }
    const before = t.slice(0, m.index), after = t.slice(m.index+m[0].length);
    if(/\d/.test(before) || /\d/.test(after)) continue; // another number elsewhere -> ambiguous, don't guess
    const exact = before.trim()==="" && after.trim()==="";
    return {pack, confidence: exact?"high":"medium", reason: exact?"Unambiguous pack format":"Quantity read from surrounding pack text"};
  }
  return null;
}
function parsePackDescription(rawText){
  if(!rawText || !String(rawText).trim()) return {pack:null, confidence:"low", reason:"Blank pack description"};
  let t = String(rawText).toUpperCase().replace(/×/g,"X").replace(/,/g,"").replace(/\$/g,"");
  t = t.replace(/\s+/g," ").trim();

  const pm = t.match(/\(([^)]*)\)/);
  if(pm){
    const outsideHasDigit = /\d/.test(t.slice(0,pm.index)) || /\d/.test(t.slice(pm.index+pm[0].length));
    if(!outsideHasDigit){
      const result = searchQuantity(pm[1].trim());
      if(result) return {...result, confidence:"medium", reason: result.reason+" (read from parenthetical detail)"};
    }
    return {pack:null, confidence:"low", reason:"Parenthetical pack detail has no clear quantity — needs a human read"};
  }

  const result = searchQuantity(t);
  if(result) return result;
  return {pack:null, confidence:"low", reason:"Could not confidently interpret pack text"};
}
function calculateEqualisedCost(pack, outerPrice){
  if(!pack || !pack.unit) return {state:"invalid", error:"Unknown or missing unit"};
  const dim = UNIT_DIMENSION[pack.unit];
  if(!dim) return {state:"invalid", error:"Unrecognised unit"};
  const factors = [pack.outers, pack.inners, pack.unitsPerInner, pack.qtyPerUnit];
  if(factors.some(f=>f===null||f===undefined||isNaN(f)||f<=0)) return {state:"invalid", error:"Invalid or missing multiplication factor"};
  if(outerPrice===null||outerPrice===undefined||isNaN(outerPrice)||outerPrice<=0) return {state:"invalid", error:"Price must be greater than zero"};
  const rawQty = pack.outers*pack.inners*pack.unitsPerInner*pack.qtyPerUnit;
  const canonicalQty = TO_CANONICAL[pack.unit](rawQty);
  if(!(canonicalQty>0)) return {state:"invalid", error:"Total quantity must be greater than zero"};
  const canonicalUnit = CANONICAL_UNIT[dim];
  return {state:"ok", dimension:dim, canonicalUnit, canonicalQty, equalisedCost: outerPrice/canonicalQty};
}
function fmtCurrency(v){ return (v===null||v===undefined||isNaN(v)) ? "—" : "$"+v.toFixed(2); }
function fmtEqualised(v,unit){
  if(v===null||v===undefined||isNaN(v)) return "—";
  const d = v<1?4:v<10?3:2;
  return "$"+v.toFixed(d)+"/"+unit;
}
function fmtQty(v,unit){ if(v==null||isNaN(v)) return "—"; return (Math.round(v*1000)/1000)+" "+unit; }

/* ---------------- STATE ---------------- */

const STORE_KEYS = { products:"gcn:products", overrides:"gcn:overrides", groups:"gcn:groupSettings" };
let S = {
  products: [],        // raw imported/demo rows

function overrideKey(supplier, sku){ return (supplier||"").trim().toUpperCase()+"||"+(sku||"").trim().toUpperCase(); }

// Persistence works two ways depending on where this file is running:
//  - Inside Claude.ai's artifact viewer, window.storage exists and is used directly.
//  - Opened as a standalone file (double-clicked, or hosted anywhere else — the
//    normal trial-distribution case) window.storage doesn't exist, so this falls
//    back to plain browser localStorage, which behaves the same way from the
//    app's point of view: local to this browser only, survives refresh/restart.
const localPersistence = {
  async get(key){
    try{ const v = localStorage.getItem(key); return v!==null ? {key, value:v} : null; }
    catch(e){ return null; }
  },
  async set(key, value){
    try{ localStorage.setItem(key, value); return {key, value}; }
    catch(e){ return null; }
  },
};
const storage = (typeof window.storage !== "undefined" && window.storage) ? window.storage : localPersistence;
const usingFallbackStorage = storage === localPersistence;

async function loadState(){
  try{ const r = await storage.get(STORE_KEYS.products); S.products = r ? JSON.parse(r.value) : []; }catch(e){ S.products = []; }
  try{ const r = await storage.get(STORE_KEYS.overrides); S.overrides = r ? JSON.parse(r.value) : {}; }catch(e){ S.overrides = {}; }
  try{ const r = await storage.get(STORE_KEYS.groups); S.groupSettings = r ? JSON.parse(r.value) : {}; }catch(e){ S.groupSettings = {}; }
  S.ready = true;
  render();
}
async function persist(which){
  try{
    if(which==="products"||which==="all") await storage.set(STORE_KEYS.products, JSON.stringify(S.products));
    if(which==="overrides"||which==="all") await storage.set(STORE_KEYS.overrides, JSON.stringify(S.overrides));
    if(which==="groups"||which==="all") await storage.set(STORE_KEYS.groups, JSON.stringify(S.groupSettings));
  }catch(e){ showToast("Could not save — storage error"); }
}

/* ---------------- COMPUTE (Trust hierarchy: Verified override > Parser prediction > Needs Review) ---------------- */

function computeProduct(p){
  const key = overrideKey(p.supplier, p.sku);
  const ov = S.overrides[key];
  let pack, status, confidence, reason, descriptionChanged=false;

  if(ov){
    pack = ov.pack; status = "verified"; confidence = "high"; reason = "Verified by user";
    const currentSourceText = (p.packText && p.packText.trim()) ? p.packText : p.description;
    if(ov.descriptionAtVerification !== undefined && ov.descriptionAtVerification !== currentSourceText){
      descriptionChanged = true;
    }
  } else {
    const sourceText = (p.packText && p.packText.trim()) ? p.packText : p.description;
    const parsed = parsePackDescription(sourceText);
    pack = parsed.pack; confidence = parsed.confidence; reason = parsed.reason;
    status = pack && confidence!=="low" ? "predicted" : "needsReview";
  }

  const calc = pack ? calculateEqualisedCost(pack, p.outerPrice) : {state:"invalid", error:"No interpretable pack structure"};
  const missingInfo = calc.state!=="ok";

  return {product:p, pack, status, confidence, reason, calc, missingInfo, descriptionChanged};
}

function allComputed(){ return S.products.map(computeProduct); }

function groupList(){
  const set = new Set();
  S.products.forEach(p=>{ if(p.group) set.add(p.group); });
  return Array.from(set).sort();
}

function groupRows(groupName){
  return allComputed().filter(c=>c.product.group===groupName);
}

function sortedValidRows(rows){
  const valid = rows.filter(r=>r.calc.state==="ok");
  const invalid = rows.filter(r=>r.calc.state!=="ok");
  valid.sort((a,b)=>a.calc.equalisedCost-b.calc.equalisedCost);
  return {valid, invalid};
}

/**
 * Resolves a group's canonical annual volume, deterministically, from
 * whichever source of truth is actually present. Nothing here is ever
 * assumed — see the two explicit modes below.
 *
 *  - Direct entry (existing, unchanged): the user already knows their
 *    annual canonical figure and typed it straight in.
 *  - Period-derived (new): the user has a period-scoped purchase quantity
 *    (e.g. a supplier "Qty" column covering 3 months) and wants it
 *    annualised. This requires an explicit choice of what that quantity
 *    represents — never inferred, never defaulted silently — because a
 *    wrong guess here would misstate cost by whatever the pack size is:
 *      "packs"     -> quantity already counts outers/cartons purchased.
 *                     canonicalAnnualVolume = qty × (12/months) × packSize
 *      "canonical" -> quantity is already a raw kg/L/each total for the
 *                     period. canonicalAnnualVolume = qty × (12/months)
 *                     (packSize plays no role in this conversion — it's
 *                     only used to show the equivalent pack count as an FYI)
 *  Derived values are never persisted — recomputed fresh every time from
 *  periodQuantity/periodMonths/periodMode plus the current baseline's pack,
 *  so a later pack correction is reflected immediately rather than leaving
 *  a stale cached annual figure sitting around.
 */
function resolveAnnualVolume(groupName){
  const gs = S.groupSettings[groupName];
  if(!gs) return {value:null, provenance:null};

  if(gs.periodQuantity!=null && gs.periodMonths!=null && gs.periodMonths>0 && gs.periodQuantity>0){
    const rows = groupRows(groupName);
    const baseline = rows.find(r=>r.product.id===gs.currentSupplierId);
    if(baseline && baseline.calc.state==="ok"){
      const annualisationFactor = 12/gs.periodMonths;
      const packSize = baseline.calc.canonicalQty; // one outer's canonical quantity, from the current supplier's own verified/predicted pack
      const mode = gs.periodMode==="canonical" ? "canonical" : "packs"; // default: treat as a pack/carton count, the common real-world case (e.g. a supplier "Qty" column)
      let canonicalAnnualVolume, annualPackVolume;
      if(mode==="canonical"){
        canonicalAnnualVolume = gs.periodQuantity * annualisationFactor;
        annualPackVolume = packSize>0 ? canonicalAnnualVolume/packSize : null; // FYI only, doesn't feed the cost calc
      } else {
        annualPackVolume = gs.periodQuantity * annualisationFactor;
        canonicalAnnualVolume = annualPackVolume * packSize;
      }
      return {
        value: canonicalAnnualVolume,
        provenance: {
          periodMonths: gs.periodMonths, periodQuantity: gs.periodQuantity, mode,
          annualisationFactor, annualPackVolume, packSize,
          canonicalUnit: baseline.calc.canonicalUnit, baselineSupplier: baseline.product.supplier,
        },
      };
    }
    // Period fields are set but there's no valid baseline pack to derive a pack size from yet — fall through to direct entry rather than guessing.
  }

  return {value: (gs.annualVolume!=null && gs.annualVolume>0) ? gs.annualVolume : null, provenance:null};
}

/**
 * An annual saving is only as trustworthy as the weakest pack interpretation
 * feeding it. Verified only when BOTH the baseline and the alternative pack
 * have been human-confirmed — one predicted side is enough to downgrade the
 * whole figure to Indicative, since the dollar gap could shrink or vanish if
 * that prediction turns out wrong.
 */
function annualSavingConfidence(baseline, alt){
  return (baseline.status==="verified" && alt.status==="verified") ? "verified" : "indicative";
}

/* ---------------- CSV parsing (minimal, quote-aware) ---------------- */

function parseCSV(text){
  const rows = []; let row=[]; let field=""; let inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length>1 || (r.length===1 && r[0].trim()!==""));
}
function toCSVField(v){
  v = (v===null||v===undefined) ? "" : String(v);
  if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"';
  return v;
}

function openPackEditor(productId){
  const p = S.products.find(x=>x.id===productId);
  const c = computeProduct(p);
  const pack = c.pack || makePack({outers:1, inners:1, unitsPerInner:1, qtyPerUnit:null, unit:null});
  S.editingProductId = productId;
  S.editDraft = {...pack};
  // Raw typed strings, shown in the fields verbatim — kept separate from the
  // parsed numeric values (used for the actual calculation) so an in-progress
  // decimal point ("7.") doesn't get silently rounded away mid-keystroke by
  // a parseFloat round-trip before the user finishes typing "7.5".
  S.editDraftRaw = {
    outers: pack.outers ?? "", inners: pack.inners ?? "", unitsPerInner: pack.unitsPerInner ?? "",
    qtyPerUnit: pack.qtyPerUnit ?? "", outerPrice: p.outerPrice ?? "",
  };
  render();
}
function closeEditor(){ S.editingProductId=null; S.editDraft=null; S.editDraftRaw=null; render(); }
function updateDraft(field, value){
  if(field==="unit"){ S.editDraft.unit = value || null; render(); return; }
  S.editDraftRaw[field] = value;
  S.editDraft[field] = value===""? null : parseFloat(value);
  render();
}
async function saveDraft(verify){
  const p = S.products.find(x=>x.id===S.editingProductId);
  const pack = {...S.editDraft};
  if(verify){
    const key = overrideKey(p.supplier, p.sku);
    const sourceText = (p.packText && p.packText.trim()) ? p.packText : p.description;
    S.overrides[key] = {pack, verifiedAt: new Date().toISOString(), descriptionAtVerification: sourceText};
    await persist("overrides");
    showToast("Pack structure verified — remembered for "+p.supplier+" / "+p.sku);
  } else {
    // Save as predicted: don't create a verified override; just adjust the source pack text
    // so the deterministic parser (or the editor, next time) starts from this structure.
    p.packText = describePack(pack);
    await persist("products");
    showToast("Saved as predicted (not yet verified)");
  }
  closeEditor();
}
function describePack(pack){
  if(!pack || !pack.unit) return "";
  const parts = [];
  const total = [pack.inners, pack.unitsPerInner].filter(n=>n && n!==1);
  if(pack.inners && pack.inners!==1 && pack.unitsPerInner && pack.unitsPerInner!==1){
    return `${pack.inners} x ${pack.unitsPerInner} x ${pack.qtyPerUnit}${pack.unit}`;
  }
  const mult = (pack.inners||1) * (pack.unitsPerInner||1);
  if(mult && mult!==1) return `${mult} x ${pack.qtyPerUnit}${pack.unit}`;
  return `${pack.qtyPerUnit}${pack.unit}`;
}
async function quickVerify(productId){
  const p = S.products.find(x=>x.id===productId);
  const c = computeProduct(p);
  if(!c.pack) { openPackEditor(productId); return; }
  const key = overrideKey(p.supplier, p.sku);
  const sourceText = (p.packText && p.packText.trim()) ? p.packText : p.description;
  S.overrides[key] = {pack:c.pack, verifiedAt:new Date().toISOString(), descriptionAtVerification: sourceText};
  await persist("overrides");
  showToast("Verified "+p.supplier+" / "+p.sku);
  render();
}

/**
 * Verifies every product ID passed in, in one batch. Deliberately narrow:
 * only ever called on a set the person has just looked at (a filtered
 * Products list, or the Unverified Predictions section) — never a hidden
 * "verify everything in the database" action. Only touches rows that are
 * still Predicted with a parseable pack; anything Needs Review or already
 * Verified is silently skipped rather than forced through.
 */
async function batchVerify(productIds){
  let count = 0;
  productIds.forEach(id=>{
    const p = S.products.find(x=>x.id===id);
    if(!p) return;
    const c = computeProduct(p);
    if(!c.pack || c.status!=="predicted") return; // only confirm what's already Predicted — never Needs Review, never re-touch Verified
    const key = overrideKey(p.supplier, p.sku);
    const sourceText = (p.packText && p.packText.trim()) ? p.packText : p.description;
    S.overrides[key] = {pack:c.pack, verifiedAt:new Date().toISOString(), descriptionAtVerification: sourceText};
    count++;
  });
  if(count>0) await persist("overrides");
  showToast(count>0 ? `Verified ${count} product${count===1?"":"s"}` : "Nothing to verify in this list");
  render();
}
function confirmBatchVerify(productIds, label){
  const n = productIds.length;
  if(n===0) return;
  if(confirm(`Verify ${n} predicted pack structure${n===1?"":"s"}${label?` (${label})`:""}?\n\nThis confirms the parser's reading is correct for all ${n} — only do this for a list you've actually reviewed.`)){
    batchVerify(productIds);
  }
}

/* ---------------- IMPORT FLOW ---------------- */

const TARGET_FIELDS = [
  {key:"supplier", label:"Supplier", required:true},
  {key:"sku", label:"Supplier SKU", required:true},
  {key:"description", label:"Product Description", required:true},
  {key:"outerPrice", label:"Outer Price", required:true},
  {key:"packText", label:"Pack Description", required:false},
  {key:"group", label:"Product Group", required:false},
  {key:"currentSupplier", label:"Current Supplier flag", required:false},
  {key:"annualVolume", label:"Annual Usage (kg/L/each)", required:false},
];

function handleFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const rows = parseCSV(e.target.result);
    if(!rows.length){ showToast("Empty or unreadable CSV"); return; }
    S.importHeaders = rows[0].map(h=>h.trim());
    S.importRows = rows.slice(1);
    // naive auto-map by fuzzy name match
    const mapping = {};
    TARGET_FIELDS.forEach(f=>{
      const fn = f.key.toLowerCase();
      let idx = -1;
      if(fn==="outerprice"){
        // A report with Lowest/Highest/Average price columns should default
        // to Average (the real weighted price paid), never Highest or Lowest —
        // those are best/worst single purchases, not a fair comparison price.
        idx = S.importHeaders.findIndex(h=>h.toLowerCase().replace(/[^a-z]/g,"").includes("average"));
        if(idx<0) idx = S.importHeaders.findIndex(h=>h.toLowerCase().replace(/[^a-z]/g,"").includes("price"));
      } else {
        idx = S.importHeaders.findIndex(h=>{
          const hn = h.toLowerCase().replace(/[^a-z]/g,"");
          // "sku" alone is too narrow — real supplier exports commonly call this
          // Product Code, Item Code, or Supplier Code instead (confirmed against
          // a real supplier export). "code" alone is deliberately NOT matched —
          // that would over-match unrelated columns like Bar Code or Currency Code.
          if(fn==="sku") return hn.includes("sku")||hn.includes("productcode")||hn.includes("itemcode")||hn.includes("suppliercode");
          if(fn==="packtext") return hn.includes("pack");
          if(fn==="group") return hn.includes("group");
          if(fn==="currentsupplier") return hn.includes("current")&&hn.includes("supplier");
          // Annual Volume is intentionally NEVER auto-mapped. A wrong guess here
          // doesn't just mis-file a column — it silently produces a wrong dollar
          // figure downstream (a header like "Annual Cost" or "Volume Discount %"
          // would previously match). Leaving it unmapped forces a deliberate
          // human choice, consistent with never manufacturing usage evidence.
          if(fn==="annualvolume") return false;
          return hn.includes(fn);
        });
      }
      mapping[f.key] = idx>=0 ? idx : -1;
    });
    S.importMapping = mapping;
    S.importStep = 1;
    render();
  };
  reader.readAsText(file);
}
async function confirmImport(){
  const req = TARGET_FIELDS.filter(f=>f.required);
  for(const f of req){ if(S.importMapping[f.key] === -1){ showToast("Please map required field: "+f.label); return; } }
  const idxOf = (k)=>S.importMapping[k];
  const newProducts = [];
  const groupVolumes = {};
  const currentCandidates = {}; // groupName -> [productId, ...] flagged "current" THIS import — collected first, resolved after, never picked implicitly.
  S.importRows.forEach(row=>{
    const get = (k)=> idxOf(k)>=0 ? (row[idxOf(k)]||"").trim() : "";
    const priceRaw = get("outerPrice").replace(/[$,]/g,"");
    const price = priceRaw==="" ? NaN : parseFloat(priceRaw);
    const group = get("group") || "Ungrouped";
    const p = {
      id: cryptoId(),
      supplier: get("supplier"),
      sku: get("sku"),
      description: get("description"),
      packText: get("packText"),
      group,
      outerPrice: isNaN(price) ? 0 : price,
    };
    if(!p.supplier && !p.sku && !p.description) return;
    newProducts.push(p);
    const flag = get("currentSupplier").toLowerCase();
    if(["y","yes","true","1","current"].includes(flag)){
      (currentCandidates[group] = currentCandidates[group]||[]).push(p.id);
    }
    const volRaw = get("annualVolume").replace(/[,]/g,"");
    if(volRaw){
      const v = parseFloat(volRaw);
      if(!isNaN(v)) groupVolumes[group] = v;
    }
  });
  Object.keys(groupVolumes).forEach(g=>{
    if(!S.groupSettings[g]) S.groupSettings[g] = {annualVolume:null, currentSupplierId:null};
    S.groupSettings[g].annualVolume = groupVolumes[g];
  });
  // Resolve current-supplier candidates deliberately: exactly one flagged row in
  // a group is unambiguous and gets accepted automatically, same as before.
  // Two or more flagged in the same group is a real ambiguity — silently picking
  // whichever was processed last would be exactly the kind of guess this tool
  // exists to refuse. Surface it in Review instead of resolving it implicitly.
  let ambiguousGroupCount = 0;
  Object.entries(currentCandidates).forEach(([g, ids])=>{
    if(!S.groupSettings[g]) S.groupSettings[g] = {annualVolume:null, currentSupplierId:null};
    if(ids.length===1){
      S.groupSettings[g].currentSupplierId = ids[0];
      S.groupSettings[g].currentSupplierAmbiguous = null;
    } else {
      S.groupSettings[g].currentSupplierAmbiguous = ids;
      ambiguousGroupCount++;
    }
  });
  S.products = S.products.concat(newProducts);
  await persist("all");
  showToast(`Imported ${newProducts.length} products` + (ambiguousGroupCount ? ` — ${ambiguousGroupCount} group${ambiguousGroupCount===1?"":"s"} need${ambiguousGroupCount===1?"s":""} a current-supplier pick` : ""));
  S.importRows=null; S.importHeaders=null; S.importMapping=null; S.importStep=0;
  S.screen = "products";
  render();
}
function cancelImport(){ S.importRows=null; S.importHeaders=null; S.importMapping=null; S.importStep=0; render(); }

/* ---------------- EXPORT ---------------- */

function exportCSV(){
  const header = ["Comparison Group","Supplier","SKU","Product","Pack","Outer Price","Total Canonical Quantity","Canonical Unit","Equalised Cost","Prediction Status","Current Supplier","Annual Usage","Annual Usage Basis","Estimated Annual Saving","Saving Confidence"];
  const lines = [header.map(toCSVField).join(",")];
  groupList().forEach(g=>{
    const rows = groupRows(g);
    const {valid} = sortedValidRows(rows);
    const gs = S.groupSettings[g] || {};
    const {value:annualVolume, provenance} = resolveAnnualVolume(g);
    const volumeBasis = provenance ? `Derived — ${provenance.periodQuantity} over ${provenance.periodMonths}mo (×${provenance.annualisationFactor.toFixed(2)})` : (annualVolume ? "Direct entry" : "");
    const baseline = valid.find(r=>r.product.id===gs.currentSupplierId);
    valid.concat(rows.filter(r=>r.calc.state!=="ok")).forEach(r=>{
      const isCurrent = r.product.id === gs.currentSupplierId;
      let saving = "", confidence = "";
      if(baseline && annualVolume && r.calc.state==="ok" && baseline.calc.state==="ok" && r.product.id!==baseline.product.id){
        saving = ((baseline.calc.equalisedCost - r.calc.equalisedCost) * annualVolume).toFixed(2);
        confidence = annualSavingConfidence(baseline, r);
      }
      lines.push([
        g, r.product.supplier, r.product.sku, r.product.description,
        describePack(r.pack) || r.product.packText || r.product.description,
        r.product.outerPrice, r.calc.state==="ok"?r.calc.canonicalQty:"", r.calc.state==="ok"?r.calc.canonicalUnit:"",
        r.calc.state==="ok"?r.calc.equalisedCost.toFixed(4):"", r.status, isCurrent?"Yes":"", annualVolume||"", volumeBasis, saving, confidence
      ].map(toCSVField).join(","));
    });
  });
  const blob = new Blob([lines.join("\n")], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "group-cost-comparison.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("Exported comparison CSV");
}

/* ---------------- RENDER HELPERS ---------------- */

function esc(s){ return (s===null||s===undefined) ? "" : String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function statusBadge(c){
  if(c.missingInfo) return `<span class="badge missing">Missing Info</span>`;
  if(c.status==="verified") return `<span class="badge verified">Verified</span>`;
  if(c.status==="predicted") return `<span class="badge predicted">Predicted</span>`;
  return `<span class="badge review">Needs Review</span>`;
}
function packChip(c){
  const dotClass = c.missingInfo ? "review" : (c.status==="verified" ? "verified" : (c.status==="predicted" ? "predicted" : "review"));
  const label = c.pack ? describePack(c.pack) || "—" : (c.product.packText || c.product.description || "—");
  return `<span class="pack-chip" onclick="openPackEditor('${c.product.id}')"><span class="dot ${dotClass}"></span>${esc(label)}</span>`;
}

function reviewCounts(){
  const all = allComputed();
  const needsReview = all.filter(c=>c.status==="needsReview" && !c.missingInfo);
  const missing = all.filter(c=>c.missingInfo);
  const unverified = all.filter(c=>c.status==="predicted" && !c.missingInfo);
  const conflicts = findConflicts(all);
  const currentSupplierConflicts = Object.entries(S.groupSettings)
    .filter(([g,gs])=>gs.currentSupplierAmbiguous && gs.currentSupplierAmbiguous.length>1)
    .map(([g,gs])=>({group:g, candidates: gs.currentSupplierAmbiguous.map(id=>S.products.find(p=>p.id===id)).filter(Boolean)}));
  return {
    needsReview, missing, unverified, conflicts, currentSupplierConflicts,
    total: new Set([...needsReview,...missing,...unverified,...conflicts].map(c=>c.product.id)).size + currentSupplierConflicts.length,
  };
}
function findConflicts(all){
  // Light heuristic: description mentions a kg/L number that disagrees with the parsed canonical qty.
  const out = [];
  all.forEach(c=>{
    if(c.calc.state!=="ok") return;
    // Strip "A/B unit" piece-size ranges first — e.g. "170/190g", "200/300g" is
    // standard per-piece portion notation, not a claim about the pack's total
    // quantity. Treating the second number in a range as a conflicting pack
    // total produced false positives on real data (barramundi/fillet portions).
    const desc = c.product.description.replace(/\d+(?:\.\d+)?\s*\/\s*\d+(?:\.\d+)?\s*(KG|G|L|ML)\b/gi, "");
    const descNums = (desc.match(/(\d+(?:\.\d+)?)\s*(KG|G|L|ML)\b/i)||[]);
    if(descNums.length===3){
      const val = parseFloat(descNums[1]);
      const unit = normaliseUnitToken(descNums[2]);
      if(unit){
        const dim = UNIT_DIMENSION[unit];
        if(CANONICAL_UNIT[dim]!==c.calc.canonicalUnit) return; // different dimension — not comparable, not a conflict signal
        const asCanonical = TO_CANONICAL[unit](val);
        const matchesTotal = Math.abs(asCanonical - c.calc.canonicalQty) <= 0.01;
        // A description number can also legitimately describe ONE unit inside
        // the pack rather than the pack's total — e.g. "600ml" on a bottle
        // description where the pack is "24 x 0.6L" (14.4L total). That's the
        // same fact stated at a different level, not a conflict. Check the
        // pack's own per-unit quantity (qtyPerUnit) before flagging.
        let matchesPerUnit = false;
        if(c.pack && c.pack.qtyPerUnit && c.pack.unit && UNIT_DIMENSION[c.pack.unit]===dim){
          const perUnitCanonical = TO_CANONICAL[c.pack.unit](c.pack.qtyPerUnit);
          if(Math.abs(asCanonical - perUnitCanonical) <= 0.01) matchesPerUnit = true;
        }
        if(!matchesTotal && !matchesPerUnit){
          out.push(c);
        }
      }
    }
  });
  return out;
}

/* ---------------- SCREENS ---------------- */

function buildStableSelector(el){
  // Identifies an element across a full re-render using whichever data-*
  // attributes it carries — good enough to be unique for every input in this app.
  const attrs = ["data-action","data-id","data-group","data-field","data-draft","data-draft-price"];
  const parts = [];
  attrs.forEach(a=>{
    if(el.hasAttribute(a)){
      const v = String(el.getAttribute(a)).replace(/\\/g,"\\\\").replace(/"/g,'\\"');
      parts.push(`[${a}="${v}"]`);
    }
  });
  if(!parts.length) return null;
  return el.tagName.toLowerCase()+parts.join("");
}

function render(){
  const app = document.getElementById("app");
  if(!S.ready){ app.innerHTML = `<div style="padding:60px;color:#4B564F;">Loading…</div>`; return; }

  // Every render rebuilds the whole page's HTML (it's the simplest way to keep
  // this single-file app correct), which would otherwise throw the browser's
  // scroll position back to the top on every edit. Capture and restore it so
  // editing a product deep in a long list doesn't bounce you back to the top.
  const scrollY = window.scrollY || document.documentElement.scrollTop || 0;
  const prevOverlay = document.querySelector(".overlay");
  const overlayScrollTop = prevOverlay ? prevOverlay.scrollTop : null;

  // Same problem, worse symptom: rebuilding the DOM also destroys whatever
  // input currently has focus — so typing anywhere re-renders on every
  // keystroke (search-as-you-type, live pack-total recalculation both need
  // that), which would otherwise kick you out of the field after one
  // character. Capture focus + cursor position, restore both after rebuilding.
  const active = document.activeElement;
  let focusSelector = null, selStart = null, selEnd = null;
  if(active && app.contains(active) && (active.tagName==="INPUT" || active.tagName==="SELECT" || active.tagName==="TEXTAREA")){
    focusSelector = buildStableSelector(active);
    if(typeof active.selectionStart === "number"){ selStart = active.selectionStart; selEnd = active.selectionEnd; }
  }

  const rc = reviewCounts();
  app.innerHTML = `
    ${railHTML(rc)}
    <div class="main">
      ${toplineHTML()}
      ${S.screen==="compare" ? compareHTML() : ""}
      ${S.screen==="review" ? reviewHTML(rc) : ""}
      ${S.screen==="products" ? productsHTML() : ""}
      ${S.screen==="import" ? importHTML() : ""}
    </div>
    ${S.editingProductId ? editorModalHTML() : ""}
    ${S.toast ? `<div class="toast">${esc(S.toast)}</div>` : ""}
  `;
  wireInputs();

  window.scrollTo(0, scrollY);
  if(overlayScrollTop !== null){
    const newOverlay = document.querySelector(".overlay");
    if(newOverlay) newOverlay.scrollTop = overlayScrollTop;
  }

  if(focusSelector){
    try{
      const el = document.querySelector(focusSelector);
      if(el){
        el.focus({preventScroll:true});
        if(selStart !== null && el.setSelectionRange){
          try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
        }
      }
    }catch(e){ /* malformed selector from unusual input text — safe to skip */ }
  }

  // Belt-and-suspenders: some browsers re-settle layout a frame after a large
  // DOM swap, which can nudge scroll position again after we just fixed it.
  requestAnimationFrame(()=>{ window.scrollTo(0, scrollY); });
}

/* ---- Compare ---- */
function compareHTML(){
  if(S.selectedGroup) return compareGroupHTML(S.selectedGroup);
  const groups = groupList();
  const all = allComputed();
  const groupsWithMultiple = groups.filter(g=>new Set(groupRows(g).map(r=>(r.product.supplier||"").trim().toUpperCase())).size>1).length;
  const rc = reviewCounts();
  let verifiedOpportunity = 0, indicativeOpportunity = 0;
  const groupOpportunity = {}; // cached per-group for reuse in the cards below
  groups.forEach(g=>{
    const rows = groupRows(g); const {valid} = sortedValidRows(rows);
    const gs = S.groupSettings[g]||{};
    const {value:annualVolume} = resolveAnnualVolume(g);
    const baseline = valid.find(r=>r.product.id===gs.currentSupplierId);
    const best = valid[0];
    let entry = null;
    if(baseline && best && annualVolume && best.product.id!==baseline.product.id){
      const diff = baseline.calc.equalisedCost - best.calc.equalisedCost;
      if(diff>0){
        const amount = diff*annualVolume;
        const confidence = annualSavingConfidence(baseline, best);
        entry = {amount, confidence};
        if(confidence==="verified") verifiedOpportunity += amount; else indicativeOpportunity += amount;
      }
    }
    groupOpportunity[g] = entry;
  });

  const summary = `
    <div class="summary-strip">
      <div class="summary-card"><div class="v num">${groups.length}</div><div class="l">Comparison groups</div></div>
      <div class="summary-card"><div class="v num">${groupsWithMultiple}</div><div class="l">Groups with multiple suppliers</div></div>
      <div class="summary-card review"><div class="v num">${rc.total}</div><div class="l">Products needing review</div></div>
      <div class="summary-card opportunity"><div class="v num">${verifiedOpportunity>0?fmtCurrency(verifiedOpportunity):"—"}</div><div class="l">Verified annual opportunity</div></div>
      <div class="summary-card opportunity indicative"><div class="v num">${indicativeOpportunity>0?fmtCurrency(indicativeOpportunity):"—"}</div><div class="l">Indicative annual opportunity</div></div>
    </div>`;

  if(!groups.length){
    return summary + `<div class="panel"><div class="empty">
      No products yet. Load the sample dataset to see how the comparison works, or import your own supplier CSV.
      <br/><button class="pill-btn primary" onclick="loadDemo()">Load Demo Data</button>
      <button class="pill-btn" onclick="setScreen('import')">Import CSV</button>
    </div></div>`;
  }

  const cards = groups.map(g=>{
    const rows = groupRows(g); const {valid} = sortedValidRows(rows);
    const best = valid[0];
    const entry = groupOpportunity[g];
    let savingNote = "";
    if(entry){
      const tierClass = entry.confidence==="verified" ? "save" : "review";
      const tierLabel = entry.confidence==="verified" ? "Verified" : "Indicative";
      savingNote = `<div class="gbest" style="color:var(--${tierClass});">${tierLabel} saving: ${fmtCurrency(entry.amount)}/yr</div>`;
    }
    const reviewInGroup = rows.filter(r=>r.status==="needsReview"||r.missingInfo).length;
    return `<button class="group-card" onclick="selectGroup('${esc(g)}')">
      <div class="gname">${esc(g)}</div>
      <div class="grow"><span>${rows.length} supplier option${rows.length===1?"":"s"}</span>${best?`<span class="num">${fmtEqualised(best.calc.equalisedCost, best.calc.canonicalUnit)}</span>`:""}</div>
      ${savingNote}
      ${reviewInGroup ? `<div class="gwarn">${reviewInGroup} need${reviewInGroup===1?"s":""} review</div>` : ""}
    </button>`;
  }).join("");

  return summary + `<div class="group-grid">${cards}</div>`;
}

function annualHeroHTML(g, gs, baseline, best, annualVolume, provenance){
  if(!baseline){
    return `<div class="annual-hero empty">
      <div class="hero-prompt">Set a current supplier below to see your estimated annual saving.</div>
    </div>`;
  }
  if(!best || best.product.id===baseline.product.id){
    return `<div class="annual-hero empty">
      <div class="hero-prompt"><b>${esc(baseline.product.supplier)}</b> already offers the best equalised price in this group.</div>
    </div>`;
  }
  const diff = baseline.calc.equalisedCost - best.calc.equalisedCost;
  if(diff<=0.0001){
    return `<div class="annual-hero empty"><div class="hero-prompt">No supplier currently beats your current price.</div></div>`;
  }
  if(!annualVolume){
    return `<div class="annual-hero empty">
      <div class="hero-prompt"><b>${esc(best.product.supplier)}</b> is ${fmtEqualised(diff, best.calc.canonicalUnit)} cheaper than <b>${esc(baseline.product.supplier)}</b>. Add annual usage below to see the dollar impact.</div>
    </div>`;
  }
  const amount = diff*annualVolume;
  const confidence = annualSavingConfidence(baseline, best);
  const isVerified = confidence==="verified";
  const tierColor = isVerified ? "var(--color-accent-2-800)" : "var(--color-accent-800)";
  const tierBg = isVerified ? "var(--color-accent-2-700)" : "var(--color-accent)";
  const tierLabel = isVerified ? "VERIFIED" : "INDICATIVE";
  const monthly = amount/12;
  const reason = isVerified
    ? `${esc(baseline.product.supplier)} ${fmtEqualised(baseline.calc.equalisedCost, baseline.calc.canonicalUnit)} vs ${esc(best.product.supplier)} ${fmtEqualised(best.calc.equalisedCost, best.calc.canonicalUnit)} — both packs confirmed by you.`
    : `Based on a predicted pack for ${esc(best.status!=="verified"?best.product.supplier:baseline.product.supplier)} — verify it to lock this number in.`;
  const provenanceLine = provenance
    ? `<div class="hero-provenance">Based on ${provenance.periodQuantity} ${provenance.mode==="packs"?"packs":provenance.canonicalUnit} over ${provenance.periodMonths} month${provenance.periodMonths==1?"":"s"} · Annualised ×${provenance.annualisationFactor.toFixed(2).replace(/\.?0+$/,"")}</div>`
    : "";
  return `<div class="annual-hero" style="background:${tierBg}; color:var(--color-bg);">
    <div class="hero-top">
      <span class="hero-group-name">${esc(g)}</span>
      <span class="badge" style="background:var(--color-bg); color:${tierColor}; border:0;">${tierLabel}</span>
    </div>
    <div class="hero-num">Save ${fmtCurrency(amount)}<span class="hero-per">/yr</span></div>
    <div class="hero-monthly">≈ ${fmtCurrency(monthly)}/mo</div>
    ${provenanceLine}
    <div class="hero-reason">${reason}</div>
  </div>`;
}

function compareGroupHTML(g){
  const rows = groupRows(g);
  const {valid, invalid} = sortedValidRows(rows);
  const gs = S.groupSettings[g] || {annualVolume:null, currentSupplierId:null};
  const baseline = valid.find(r=>r.product.id===gs.currentSupplierId);
  const best = valid[0];
  const {value:annualVolume, provenance} = resolveAnnualVolume(g);
  const usingPeriodMode = gs.periodQuantity!=null && gs.periodMonths!=null;

  const supplierOptions = rows.map(r=>`<option value="${r.product.id}" ${gs.currentSupplierId===r.product.id?"selected":""}>${esc(r.product.supplier)} — ${esc(r.product.sku)}</option>`).join("");

  const bodyRows = valid.map((r,i)=>{
    const isBest = i===0;
    const isCurrent = r.product.id===gs.currentSupplierId;
    let diffNote = "";
    if(baseline && r.product.id!==baseline.product.id && baseline.calc.state==="ok"){
      const diff = r.calc.equalisedCost-baseline.calc.equalisedCost;
      const cls = diff<0 ? "pos" : "";
      diffNote = `<div class="diff-note ${cls}">${diff<0?"−":"+"}${fmtEqualised(Math.abs(diff), r.calc.canonicalUnit)} vs current</div>`;
    }
    let annualCell = "—";
    if(baseline && annualVolume && r.product.id!==baseline.product.id){
      const diff = baseline.calc.equalisedCost-r.calc.equalisedCost;
      if(diff>0.0001){
        const tier = annualSavingConfidence(baseline, r);
        const col = tier==="verified" ? "var(--save)" : "var(--review)";
        annualCell = `<span style="color:${col}; font-weight:600;">Save ${fmtCurrency(diff*annualVolume)}</span>`;
      } else if(diff<-0.0001){
        annualCell = `<span style="color:var(--danger);">Costs ${fmtCurrency(-diff*annualVolume)} more</span>`;
      }
    } else if(isCurrent){ annualCell = "Current"; }
    return `<tr class="${isBest?'best-row':''}">
      <td>${esc(r.product.supplier)}<div style="font-size:11px;color:var(--ink-soft);">${esc(r.product.sku)}</div></td>
      <td style="max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${esc(r.product.description)}">${esc(r.product.description)}</td>
      <td>${packChip(r)} ${statusBadge(r)}</td>
      <td class="right num-cell">${fmtCurrency(r.product.outerPrice)}</td>
      <td class="right num-cell"><b>${fmtEqualised(r.calc.equalisedCost, r.calc.canonicalUnit)}</b>${diffNote}</td>
      <td>${isCurrent ? `<span class="badge" style="border:1px solid var(--color-neutral-400); color:var(--color-neutral-800); background:transparent;">Current Supplier</span>` : (isBest?`<span class="badge verified">Best Price</span>`:"")}</td>
      <td class="right num-cell">${annualCell}</td>
    </tr>`;
  }).join("");

  const invalidRows = invalid.map(r=>`<tr>
      <td>${esc(r.product.supplier)}<div style="font-size:11px;color:var(--ink-soft);">${esc(r.product.sku)}</div></td>
      <td style="max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${esc(r.product.description)}">${esc(r.product.description)}</td>
      <td>${packChip(r)} ${statusBadge(r)}</td>
      <td class="right num-cell">${fmtCurrency(r.product.outerPrice)}</td>
      <td class="right" colspan="3" style="color:var(--danger); font-size:12.5px;">${esc(r.calc.error||"Cannot calculate")}</td>
    </tr>`).join("");

  const periodPanel = S.periodPanelOpen && S.periodPanelOpen[g];
  const volumeFieldsHTML = periodPanel ? `
        <div>
          <label style="display:block;font-size:11px;color:var(--ink-soft);margin-bottom:3px;">Quantity purchased</label>
          <input type="text" inputmode="decimal" data-action="set-period-qty" data-group="${esc(g)}" value="${gs.periodQuantity ?? ''}" placeholder="e.g. 141" style="width:110px;"/>
        </div>
        <div>
          <label style="display:block;font-size:11px;color:var(--ink-soft);margin-bottom:3px;">Represents</label>
          <select data-action="set-period-mode" data-group="${esc(g)}" style="width:170px;">
            <option value="packs" ${gs.periodMode!=="canonical"?"selected":""}>Packs/cartons purchased</option>
            <option value="canonical" ${gs.periodMode==="canonical"?"selected":""}>Total ${valid[0]?valid[0].calc.canonicalUnit:'units'} purchased</option>
          </select>
        </div>
        <div>
          <label style="display:block;font-size:11px;color:var(--ink-soft);margin-bottom:3px;">Over how many months</label>
          <input type="text" inputmode="decimal" data-action="set-period-months" data-group="${esc(g)}" value="${gs.periodMonths ?? ''}" placeholder="e.g. 3" style="width:90px;"/>
        </div>
        <button class="pill-btn ghost" onclick="clearPeriodMode('${esc(g)}')" style="align-self:center;">Use direct annual figure instead</button>
    ` : `
        <div>
          <label style="display:block;font-size:11px;color:var(--ink-soft);margin-bottom:3px;">Annual group usage (${valid[0]?valid[0].calc.canonicalUnit:'units'})</label>
          <input type="number" min="0" data-action="set-volume" data-group="${esc(g)}" value="${gs.annualVolume ?? ''}" placeholder="e.g. 22400" style="width:150px;"/>
        </div>
        <button class="pill-btn ghost" onclick="togglePeriodPanel('${esc(g)}')" style="align-self:center;">Calculate from period usage instead</button>
    `;

  return `
    <button class="pill-btn ghost" onclick="setScreen('compare')" style="margin-bottom:14px;">← All groups</button>
    ${annualHeroHTML(g, gs, baseline, best, annualVolume, provenance)}
    <div class="panel">
      <div class="panel-head">
        <h2>${esc(g)}</h2>
        <div class="hint">${rows.length} supplier option${rows.length===1?"":"s"}</div>
      </div>
      <div class="filters" style="align-items:flex-end;">
        <div>
          <label style="display:block;font-size:11px;color:var(--ink-soft);margin-bottom:3px;">Current supplier</label>
          <select data-action="set-current" data-group="${esc(g)}" style="min-width:220px;">

        </div>
        ${volumeFieldsHTML}
      </div>
      <table>
        <thead><tr><th>Supplier</th><th>Product</th><th>Pack</th><th class="right">Outer Price</th><th class="right">Equalised</th><th>Status</th><th class="right">Annual Impact</th></tr></thead>
        <tbody>${bodyRows}${invalidRows}</tbody>
      </table>
    </div>
  `;

    <td class="right">${statusBadge(c)}</td>
    <td class="right"><button class="pill-btn" onclick="openPackEditor('${c.product.id}')">Edit</button></td></tr>`;

  const unverifiedBatchAction = list => list.length ? `<button class="pill-btn save" onclick='confirmBatchVerify(${JSON.stringify(list.map(c=>c.product.id))}, "Unverified Predictions")'>Verify all ${list.length} shown</button>` : "";

  const currentSupplierConflictsPanel = rc.currentSupplierConflicts.length ? `
    <div class="panel">
      <div class="panel-head"><h2>Current Supplier Conflicts <span class="hint" style="font-weight:400;">(${rc.currentSupplierConflicts.length})</span></h2><div class="hint">More than one row was flagged current in the same import.</div></div>
      <table><tbody>
        ${rc.currentSupplierConflicts.map(cc=>`<tr>
          <td style="width:32%;"><b>${esc(cc.group)}</b></td>
          <td>${cc.candidates.map(p=>`${esc(p.supplier)} · ${esc(p.sku)}`).join("<br/>")}</td>
          <td class="right"><button class="pill-btn save" onclick="selectGroup('${esc(cc.group)}')">Pick one on Compare</button></td>
        </tr>`).join("")}
      </tbody></table>
    </div>` : "";

  return `
    ${currentSupplierConflictsPanel}
    ${section("Needs Review","Pack structure can't be confidently determined.", rc.needsReview, rowNeedsReview)}
    ${section("Missing Information","Normalisation can't be calculated yet.", rc.missing, rowMissing)}
    ${section("Conflicts","Imported or inferred information disagrees.", rc.conflicts, rowConflict)}
    ${section("Unverified Predictions","Looks right — confirm to lock it in.", rc.unverified, rowUnverified, unverifiedBatchAction)}
  `;
}

/* ---- Products ---- */
function productsHTML(){
  const groups = groupList();
  const f = S.filters;
  let rows = allComputed();
  if(f.search){ const s=f.search.toLowerCase(); rows = rows.filter(c=>(c.product.description+c.product.sku+c.product.supplier).toLowerCase().includes(s)); }
  if(f.supplier) rows = rows.filter(c=>c.product.supplier===f.supplier);
  if(f.group) rows = rows.filter(c=>c.product.group===f.group);
  if(f.status) rows = rows.filter(c=> f.status==="missing" ? c.missingInfo : (!c.missingInfo && c.status===f.status));
  rows = rows.slice().sort((a,b)=>{
    const av = a.calc.state==="ok" ? a.calc.equalisedCost : Infinity;
    const bv = b.calc.state==="ok" ? b.calc.equalisedCost : Infinity;
    return av-bv;
  });
  const suppliers = Array.from(new Set(S.products.map(p=>p.supplier))).sort();

  const body = rows.map(c=>`<tr>
    <td>${esc(c.product.supplier)}</td>
    <td class="num-cell">${esc(c.product.sku)}</td>
    <td>${esc(c.product.description)}</td>
    <td><input type="text" class="group-input" list="gcn-groups-datalist" data-action="set-group" data-id="${c.product.id}" value="${esc(c.product.group||'Ungrouped')}" placeholder="Ungrouped"/></td>
    <td>${packChip(c)}</td>
    <td class="right num-cell">${fmtCurrency(c.product.outerPrice)}</td>
    <td class="right num-cell">${c.calc.state==="ok"?fmtEqualised(c.calc.equalisedCost,c.calc.canonicalUnit):`<span style="color:var(--danger);">${esc(c.calc.error)}</span>`}</td>
    <td>${statusBadge(c)}</td>
    <td class="right">
      ${c.status!=="verified" && c.pack ? `<button class="pill-btn ghost" onclick="quickVerify('${c.product.id}')">Verify</button>` : ""}
      <button class="pill-btn ghost" onclick="openPackEditor('${c.product.id}')">Edit</button>
    </td>
  </tr>`).join("");

  return `<div class="panel">
    <datalist id="gcn-groups-datalist">${groups.map(g=>`<option value="${esc(g)}">`).join("")}</datalist>
    <div class="filters">
      <input type="text" placeholder="Search description, SKU, supplier…" data-action="search" value="${esc(f.search)}"/>
      <select data-action="filter-supplier"><option value="">All suppliers</option>${suppliers.map(s=>`<option value="${esc(s)}" ${f.supplier===s?"selected":""}>${esc(s)}</option>`).join("")}</select>
      <select data-action="filter-group"><option value="">All groups</option>${groups.map(g=>`<option value="${esc(g)}" ${f.group===g?"selected":""}>${esc(g)}</option>`).join("")}</select>
      <select data-action="filter-status">
        <option value="">All statuses</option>
        <option value="verified" ${f.status==='verified'?'selected':''}>Verified</option>
        <option value="predicted" ${f.status==='predicted'?'selected':''}>Predicted</option>
        <option value="needsReview" ${f.status==='needsReview'?'selected':''}>Needs Review</option>
        <option value="missing" ${f.status==='missing'?'selected':''}>Missing Information</option>
      </select>
      <button class="pill-btn" style="margin-left:auto;" onclick="exportCSV()">Export CSV</button>
    </div>
    ${(() => {
      const predictedShown = rows.filter(c=>c.status==="predicted" && !c.missingInfo);
      if(!predictedShown.length) return "";
      const scopeLabel = (f.search||f.supplier||f.group||f.status) ? "current filter" : "all products";
      return `<div class="hint" style="padding:0 16px 10px 16px; display:flex; align-items:center; gap:10px;">
        <button class="pill-btn save" onclick='confirmBatchVerify(${JSON.stringify(predictedShown.map(c=>c.product.id))}, "${esc(scopeLabel)}")'>Verify all ${predictedShown.length} predicted (${esc(scopeLabel)})</button>
        <span>Narrow with the filters above first if you only want to verify a specific supplier or group.</span>
      </div>`;
    })()}
    <div class="hint" style="padding:0 16px 10px 16px;">Type a new name in Group to split products out of a broad import category — e.g. change "SFRO" to "Squid" for just the squid lines. Matching names (exact, across suppliers) are what makes two products comparable.</div>
    ${rows.length ? `<table>
      <thead><tr><th>Supplier</th><th>SKU</th><th>Description</th><th>Group</th><th>Pack</th><th class="right">Outer Price</th><th class="right">Equalised</th><th>Status</th><th></th></tr></thead>
      <tbody>${body}</tbody>
    </table>` : `<div class="empty">No products match. <button class="pill-btn primary" onclick="loadDemo()">Load Demo Data</button></div>`}
  </div>`;
}

/* ---- Import ---- */
function importHTML(){
  if(!S.importRows){
    return `<div class="panel"><div class="dropzone" id="dropzone">
      <div style="font-size:14px; margin-bottom:8px;">Drop a supplier CSV here, or</div>
      <button class="pill-btn primary" onclick="document.getElementById('fileInput').click()">Choose file</button>
      <input type="file" id="fileInput" accept=".csv"/>
      <div class="hint" style="margin-top:14px;">Required: Supplier, Supplier SKU, Product Description, Outer Price.<br/>Optional: Pack Description, Product Group, Current Supplier flag, Annual Usage.</div>
    </div></div>`;
  }
  const rowsPreview = S.importRows.slice(0,5);
  return `<div class="panel">
    <div class="panel-head"><h2>Map columns</h2><div class="hint">${S.importRows.length} rows detected</div></div>
    <div class="map-grid">
      ${TARGET_FIELDS.map(f=>`
        <div class="map-row">
          <label>${f.label}${f.required?'<span class="req">Required</span>':''}</label>
          <select data-action="map-field" data-field="${f.key}">
            <option value="-1" ${S.importMapping[f.key]===-1?"selected":""}>Not mapped</option>
            ${S.importHeaders.map((h,i)=>`<option value="${i}" ${S.importMapping[f.key]===i?"selected":""}>${esc(h)}</option>`).join("")}
          </select>
        </div>`).join("")}
    </div>
    <div class="panel-head" style="border-top:1px solid var(--line-soft); border-bottom:none;"><h2 style="font-size:12.5px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:.4px;">Preview</h2></div>
    <table><thead><tr>${S.importHeaders.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>${rowsPreview.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>
    <div class="modal-foot" style="border-top:1px solid var(--line-soft);">
      <button class="pill-btn" onclick="cancelImport()">Cancel</button>
      <button class="pill-btn primary" onclick="confirmImport()">Import ${S.importRows.length} products</button>
    </div>
  </div>`;
}

/* ---- Pack editor modal ---- */
function editorModalHTML(){
  const p = S.products.find(x=>x.id===S.editingProductId);
  const c = computeProduct(p);
  const d = S.editDraft;
  const calc = calculateEqualisedCost(d, p.outerPrice);
  const ov = S.overrides[overrideKey(p.supplier,p.sku)];

  return `<div class="overlay" onclick="if(event.target===this) closeEditor()">
    <div class="modal">
      <div class="modal-head">
        <div class="kicker">Pack Structure</div>
        <h3>${esc(p.description)}</h3>
        <div class="sku">${esc(p.supplier)} · ${esc(p.sku)}</div>
      </div>
      <div class="modal-body">
        ${p.packText ? `<div class="src-note">Supplier pack text: <b>${esc(p.packText)}</b> ${c.reason?`— <span style="color:var(--ink-soft);">${esc(c.reason)}</span>`:""}</div>` : ""}
        ${ov ? `<div class="src-note" style="background:var(--save-bg); color:var(--save);">Verified ${new Date(ov.verifiedAt).toLocaleDateString()}${c.descriptionChanged ? ' — <b>description has changed since this was verified.</b>' : ''}</div>` : ""}
        <div class="field-row">
          <div class="field"><label>Outers</label><input type="text" inputmode="numeric" data-draft="outers" value="${esc(S.editDraftRaw.outers)}"/></div>
          <div class="field"><label>Inners per outer</label><input type="text" inputmode="numeric" data-draft="inners" value="${esc(S.editDraftRaw.inners)}"/></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Units per inner</label><input type="text" inputmode="numeric" data-draft="unitsPerInner" value="${esc(S.editDraftRaw.unitsPerInner)}"/></div>
          <div class="field"><label>Quantity per unit</label><input type="text" inputmode="decimal" data-draft="qtyPerUnit" value="${esc(S.editDraftRaw.qtyPerUnit)}"/></div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Unit</label>
            <select data-draft="unit">
              <option value="">Select a unit</option>
              <optgroup label="Mass">
                <option value="MG" ${d.unit==='MG'?'selected':''}>mg</option>
                <option value="G" ${d.unit==='G'?'selected':''}>g</option>
                <option value="KG" ${d.unit==='KG'?'selected':''}>kg</option>
              </optgroup>
              <optgroup label="Volume">
                <option value="ML" ${d.unit==='ML'?'selected':''}>mL</option>
                <option value="L" ${d.unit==='L'?'selected':''}>L</option>
              </optgroup>
              <optgroup label="Count">
                <option value="EACH" ${d.unit==='EACH'?'selected':''}>each</option>
              </optgroup>
            </select>
          </div>
          <div class="field"><label>Outer price</label><input type="text" inputmode="decimal" data-draft-price="1" value="${esc(S.editDraftRaw.outerPrice)}"/></div>
        </div>
        <div class="ladder">OUTER <b>${d.outers ?? '?'}</b> → INNER <b>${d.inners ?? '?'}</b> → UNIT <b>${d.unitsPerInner ?? '?'}</b> → QTY <b>${d.qtyPerUnit ?? '?'}${d.unit?(' '+d.unit.toLowerCase()):''}</b></div>
        <div class="derived">
          <div class="row total"><span>Derived total</span><span class="v num">${calc.state==='ok'?fmtQty(calc.canonicalQty, calc.canonicalUnit):'—'}</span></div>
          <div class="row cost"><span>Equalised cost</span><span class="v num">${calc.state==='ok'?fmtEqualised(calc.equalisedCost, calc.canonicalUnit):'—'}</span></div>
          ${calc.state!=='ok' ? `<div class="warn">${esc(calc.error)}</div>` : ""}
        </div>
      </div>
      <div class="modal-foot">
        <button class="pill-btn" onclick="closeEditor()">Cancel</button>
        <button class="pill-btn" onclick="saveDraft(false)">Save as Predicted</button>
        <button class="pill-btn save" ${calc.state!=='ok'?'disabled':''} onclick="saveDraft(true)">Save &amp; Verify</button>
      </div>
    </div>
  </div>`;
}

/* ---------------- WIRING ---------------- */

function wireInputs(){
  const dz = document.getElementById("dropzone");
  if(dz){
    dz.addEventListener("dragover", e=>{ e.preventDefault(); dz.style.borderColor="var(--color-accent)"; });
    dz.addEventListener("dragleave", ()=>{ dz.style.borderColor=""; });
    dz.addEventListener("drop", e=>{ e.preventDefault(); dz.style.borderColor=""; if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
  }
  const fi = document.getElementById("fileInput");
  if(fi) fi.addEventListener("change", e=>{ if(e.target.files[0]) handleFile(e.target.files[0]); });

  document.querySelectorAll('[data-draft]').forEach(el=>{
    el.addEventListener("input", ()=> updateDraft(el.getAttribute("data-draft"), el.value));
  });
  document.querySelectorAll('[data-draft-price]').forEach(el=>{
    el.addEventListener("input", ()=>{
      const p = S.products.find(x=>x.id===S.editingProductId);
      S.editDraftRaw.outerPrice = el.value;
      p.outerPrice = el.value===""?0:parseFloat(el.value);
      render();
    });
  });
  document.querySelectorAll('[data-action="search"]').forEach(el=>el.addEventListener("input", ()=>{ S.filters.search=el.value; render(); }));
  document.querySelectorAll('[data-action="filter-supplier"]').forEach(el=>el.addEventListener("change", ()=>{ S.filters.supplier=el.value; render(); }));
  document.querySelectorAll('[data-action="filter-group"]').forEach(el=>el.addEventListener("change", ()=>{ S.filters.group=el.value; render(); }));
  document.querySelectorAll('[data-action="filter-status"]').forEach(el=>el.addEventListener("change", ()=>{ S.filters.status=el.value; render(); }));
  document.querySelectorAll('[data-action="set-group"]').forEach(el=>{
    el.addEventListener("change", ()=>setGroupForProduct(el.getAttribute("data-id"), el.value.trim() || "Ungrouped"));
    el.addEventListener("keydown", e=>{ if(e.key==="Enter") el.blur(); });
  });
  document.querySelectorAll('[data-action="set-current"]').forEach(el=>el.addEventListener("change", ()=>setGroupField(el.getAttribute("data-group"), "currentSupplierId", el.value)));
  document.querySelectorAll('[data-action="set-volume"]').forEach(el=>el.addEventListener("change", ()=>setGroupField(el.getAttribute("data-group"), "annualVolume", el.value)));
  document.querySelectorAll('[data-action="set-period-qty"]').forEach(el=>el.addEventListener("change", ()=>setGroupField(el.getAttribute("data-group"), "periodQuantity", el.value)));
  document.querySelectorAll('[data-action="set-period-months"]').forEach(el=>el.addEventListener("change", ()=>setGroupField(el.getAttribute("data-group"), "periodMonths", el.value)));
  document.querySelectorAll('[data-action="set-period-mode"]').forEach(el=>el.addEventListener("change", ()=>setGroupField(el.getAttribute("data-group"), "periodMode", el.value)));
  document.querySelectorAll('[data-action="map-field"]').forEach(el=>el.addEventListener("change", ()=>{ S.importMapping[el.getAttribute("data-field")] = parseInt(el.value); }));
}

function confirmReset(){
  if(confirm("This will permanently delete all local prototype data (products, verifications, group settings). Continue?")) resetPrototype();
}

/* ---------------- INIT ---------------- */
loadState();
</script>
</body>
</html>
